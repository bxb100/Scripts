    body {
      min-height: 100%;
      overflow-x: hidden;
      margin: 0;
    }
    .box {
      position: absolute;
      overflow: hidden;
      background-color: rgb(34 36 53);
      background-repeat: no-repeat;
      background-size: 100%;
      border-radius: 16px;
      box-shadow:
        0 0 2px 0 rgb(255 255 255 / 0.2),
        0 4px 28px 0 rgb(0 0 0 / 0.4);
    }
    .box img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: center top;
      user-select: none;
    }
    .box.skeleton {
      background-image: none;
    }
    .box.skeleton::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgb(255 255 255 / 0.08) 45%,
        rgb(255 255 255 / 0.13) 50%,
        transparent 65%
      );
      transform: translateX(-100%);
      animation: skeleton-shimmer 1.6s ease-in-out infinite;
    }
    .box.skeleton .prompt {
      display: block;
      top: auto;
      bottom: 0;
      height: 52px;
      padding: 0;
    }
    .box.skeleton .prompt::before,
    .box.skeleton .prompt::after {
      content: "";
      position: absolute;
      left: 12px;
      height: 10px;
      border-radius: 999px;
      background: rgb(89 95 111 / 0.62);
    }
    .box.skeleton .prompt::before {
      top: 13px;
      width: 68%;
    }
    .box.skeleton .prompt::after {
      top: 31px;
      width: 42%;
    }
    .prompt {
      position: absolute;
      width: 100%;
      box-sizing: border-box;
      display: -webkit-box;
      padding: 8px 12px 0;
      overflow-wrap: anywhere;
      color: rgb(192 198 205);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: 14px;
      cursor: text;
      white-space: pre-wrap;
      -webkit-box-orient: vertical;
      scrollbar-color: rgb(89 95 111) transparent;
      scrollbar-width: thin;
      transition: opacity 180ms ease;
    }
    .prompt::before {
      content: "❝";
      padding-right: 2px;
      color: rgb(122 126 130);
    }
    .prompt.expandable {
      cursor: pointer;
    }
    .prompt.expandable:focus-visible {
      outline: 2px solid rgb(174 195 255 / 0.8);
      outline-offset: -2px;
    }
    .description-card {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      z-index: 3;
      box-sizing: border-box;
      max-height: calc(100% - 36px);
      padding: 18px 18px 20px;
      overflow: auto;
      border-radius: 16px;
      background: rgb(34 36 53 / 0.96);
      box-shadow:
        0 0 2px 0 rgb(255 255 255 / 0.2),
        0 4px 28px 0 rgb(0 0 0 / 0.4);
      color: rgb(192 198 205);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: 14px;
      line-height: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overscroll-behavior: contain;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
      scrollbar-color: rgb(106 114 135) transparent;
      scrollbar-width: thin;
      opacity: 0;
      clip-path: inset(calc(100% - 60px) 0 0 round 16px);
      transform: translateY(22px) scale(0.92);
      transform-origin: center bottom;
      pointer-events: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition:
        opacity 180ms ease,
        clip-path 420ms cubic-bezier(0.2, 0.9, 0.25, 1),
        transform 420ms cubic-bezier(0.2, 0.9, 0.25, 1.15);

    .description-card::before {
      content: "❝";
      padding-right: 2px;
      color: rgb(122 126 130);
    }
    .box.description-expanded .prompt {
      opacity: 0;
      pointer-events: none;
    }
    .box.description-expanded .description-card {
      opacity: 1;
      clip-path: inset(0 0 0 round 16px);
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .description-card:focus-visible {
      outline: 2px solid rgb(174 195 255 / 0.85);
      outline-offset: -3px;
    }
    #status {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgb(1 5 19 / 0.78);
      color: rgb(192 198 205);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      text-align: center;
      backdrop-filter: blur(12px);
    }
    #status[hidden] {
      display: none;
    }
    .status-card {
      max-width: 34rem;
      padding: 20px 24px;
      /*border-radius: 16px;*/
      /*background: rgb(34 36 53 / 0.96);*/
      /*box-shadow:
        0 0 2px 0 rgb(255 255 255 / 0.2),
        0 4px 28px 0 rgb(0 0 0 / 0.4);*/
    }
    .spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 14px;
      border: 2px solid rgb(255 255 255 / 0.18);
      border-top-color: rgb(226 231 240);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status-title {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }
    .status-detail {
      margin: 8px 0 0;
      color: rgb(122 126 130);
      font-size: 13px;
      line-height: 1.5;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes skeleton-shimmer {
      to { transform: translateX(100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .box.skeleton::before { animation: none; }
      .description-card { transition: none; }
    }

<body>
  <div id="status" role="status" aria-live="polite">
    <div class="status-card">
      <div class="spinner" aria-hidden="true"></div>
      <p class="status-title">Loading shared album</p>
      <p class="status-detail">Fetching album metadata and photos from Immich.</p>
    </div>
  </div>

  <script>
    const statusNode = document.getElementById('status');

    const shareKeyMatch = window.location.pathname.match(/^\/share\/([^/]+)\/?$/);
    let sharedLinkKey = '';
    try {
      sharedLinkKey = decodeURIComponent(shareKeyMatch?.[1] ?? '');
    } catch {}

    function apiUrl(path) {
      const url = new URL(path, window.location.origin);
      url.searchParams.set('key', sharedLinkKey);
      return url.pathname + url.search;
    }

    function setStatus(title, detail) {
      statusNode.hidden = false;
      statusNode.querySelector('.status-title').textContent = title;
      statusNode.querySelector('.status-detail').textContent = detail;
      statusNode.querySelector('.spinner').hidden = true;
    }

    async function fetchJson(path) {
      const response = await fetch(apiUrl(path), {
        headers: { accept: 'application/json' },
        credentials: 'omit',
      });
      if (!response.ok) {
        throw new Error('Request failed (' + response.status + ').');
      }
      return response.json();
    }

    async function mapWithConcurrency(items, concurrency, mapper) {
      const results = new Array(items.length);
      let cursor = 0;

      async function consume() {
        while (cursor < items.length) {
          const index = cursor++;
          results[index] = await mapper(items[index], index);
        }
      }

      await Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, consume));
      return results;
    }

    function bucketDate(value) {
      return value.includes('T') ? value : value + 'T00:00:00.000Z';
    }

    function normalizeBucket(bucket) {
      const ids = Array.isArray(bucket.id) ? bucket.id : [];
      return ids.map(function toAsset(id, index) {
        return {
          id,
          ratio: Number(Array.isArray(bucket.ratio) ? bucket.ratio[index] : 0),
          thumbhash: String(Array.isArray(bucket.thumbhash) ? bucket.thumbhash[index] || '' : ''),
          isImage: !Array.isArray(bucket.isImage) || bucket.isImage[index] === true,
          isTrashed: Array.isArray(bucket.isTrashed) && bucket.isTrashed[index] === true,
          status: String(Array.isArray(bucket.status) ? bucket.status[index] || '' : ''),
        };
      });
    }

    function fileNameWithoutExtension(value) {
      const name = typeof value === 'string' ? value.trim() : '';
      return name.replace(/\.[^.]+$/, '');
    }

    function assetImageUrl(asset, size) {
      const params = new URLSearchParams({ size });
      if (asset.thumbhash) params.set('c', asset.thumbhash);
      return apiUrl('/api/assets/' + encodeURIComponent(asset.id) + '/thumbnail?' + params.toString());
    }

    function fallbackAssetDimensions(asset) {
      const ratio = Number.isFinite(asset.ratio) && asset.ratio > 0 ? asset.ratio : 1;
      const height = 4096;
      return {
        width: Math.max(1, Math.round(ratio * height)),
        height,
      };
    }

    function createSkeletonItem(asset, index) {
      const { width, height } = fallbackAssetDimensions(asset);
      return {
        id: asset.id,
        w: width,
        h: height,
        prompt: 'Photo ' + (index + 1),
        thumbnailUrl: assetImageUrl(asset, 'thumbnail'),
        previewUrl: assetImageUrl(asset, 'preview'),
        skeleton: true,
      };
    }

    async function loadGalleryMetadata(asset, index) {
      let detail;
      try {
        detail = await fetchJson('/api/assets/' + encodeURIComponent(asset.id));
      } catch (error) {
        console.warn('Unable to load asset metadata', asset.id, error);
        return null;
      }

      const fallbackDimensions = fallbackAssetDimensions(asset);
      const detailWidth = Number(detail?.width);
      const detailHeight = Number(detail?.height);
      const width = Number.isFinite(detailWidth) && detailWidth > 0 ? detailWidth : fallbackDimensions.width;
      const height = Number.isFinite(detailHeight) && detailHeight > 0 ? detailHeight : fallbackDimensions.height;
      const description = typeof detail?.exifInfo?.description === 'string'
        ? detail.exifInfo.description.trim()
        : '';
      const fallbackName = fileNameWithoutExtension(detail?.originalFileName);
      const prompt = description || fallbackName || 'Photo ' + (index + 1);

      return {
        w: width,
        h: height,
        prompt,
      };
    }

    async function loadPhotoGalleryData() {
      if (!sharedLinkKey) throw new Error('Open this gallery with /share/{key}.');
      const sharedLink = await fetchJson('/api/shared-links/me');
      if (!sharedLink.album || !sharedLink.album.id) throw new Error('The shared link does not contain an album.');

      const album = sharedLink.album;
      const order = album.order === 'asc' ? 'asc' : 'desc';
      const showMetadata = sharedLink.showMetadata === true;
      document.title = album.albumName ? album.albumName + ' — Photo Gallery' : 'Photo Gallery';

      const bucketQuery = new URLSearchParams({ albumId: album.id, order });
      const buckets = await fetchJson('/api/timeline/buckets?' + bucketQuery.toString());
      if (!Array.isArray(buckets)) throw new Error('Immich returned an invalid timeline bucket list.');

      const bucketPayloads = await mapWithConcurrency(buckets, 4, function loadBucket(bucket) {
        const query = new URLSearchParams({
          albumId: album.id,
          order,
          timeBucket: bucketDate(String(bucket.timeBucket)),
        });
        return fetchJson('/api/timeline/bucket?' + query.toString());
      });

      const timelineAssets = bucketPayloads
        .flatMap(normalizeBucket)
        .filter(function keepImage(asset) {
          return asset.isImage && !asset.isTrashed && (!asset.status || asset.status === 'active');
        });

      return {
        items: timelineAssets.map(createSkeletonItem),
        assets: timelineAssets,
        showMetadata,
      };
    }

    function startGallery(photoGalleryData, requestHydrationWindow) {
      let scheduledRender = false;
      let pendingScrollFrames = 0;
      function scheduleRender() {
        if (scheduledRender) return;
        scheduledRender = true;
        requestAnimationFrame(function renderAndMaybeScheduleAnotherRender(now) {
          scheduledRender = false;
          const stillAnimating = render(now);
          if (pendingScrollFrames > 0) pendingScrollFrames -= 1;
          if (stillAnimating || pendingScrollFrames > 0) scheduleRender();
        });
      }

      function scheduleScrollRender() {
        pendingScrollFrames = 2;
        scheduleRender();
      }

      const msPerAnimationStep = 4;
      // Drop long gaps instead of replaying every missed frame after tab suspension.
      const maxAnimationCatchUpMs = 64;

      function spring(pos, v = 0, k = 290, b = 30) {
        return {
          pos,
          dest: pos,
          v,
          k,
          b,
        };
      }

      function springStep(config) {
        const t = msPerAnimationStep / 1000;
        const springForce = -config.k * (config.pos - config.dest);
        const damperForce = -config.b * config.v;
        const acceleration = springForce + damperForce;
        const newVelocity = config.v + acceleration * t;
        config.pos += newVelocity * t;
        config.v = newVelocity;
      }

      function springGoToEnd(config) {
        config.pos = config.dest;
        config.v = 0;
      }

      function clamp(min, value, max) {
        return Math.min(max, Math.max(min, value));
      }

      const promptPaddingBottom = 8;
      const promptSizeY = 52;
      const prompt1DSizeY = 72;
      const boxesGapX = 24;
      const boxesGapY = 24;
      const boxes1DGapX = 52;
      const boxes1DGapY = 28;
      const windowPaddingTop = 40;
      const gapTopPeek = 40;
      const hitArea1DSizeX = 100;

      function colsBoxMaxSizeXF(containerSizeX) {
        const boxMinSizeX = 220;
        const cols = clamp(1, Math.floor((containerSizeX - boxesGapX) / (boxMinSizeX + boxesGapX)), 7);
        return {
          cols,
          boxMaxSizeX: Math.max(1, (containerSizeX - boxesGapX - cols * boxesGapX) / cols),
        };
      }

      const isSafari = navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome');
      if (isSafari) {
        document.body.style.contain = 'layout';
        document.body.style.width = '100vw';
        document.body.style.height = '100vh';
      }

      let animatedUntilTime = null;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const coarsePointer = window.matchMedia('(hover: none) and (pointer: coarse)');
      let anchor = 0;
      let expandedPromptId = null;
      let windowSizeX = document.documentElement.clientWidth;
      let scrollY = isSafari ? document.body.scrollTop : window.scrollY;
      const pointer = { x: -Infinity, y: -Infinity };
      const events = { keydown: null, click: null, mousemove: null };
      const previewLru = [];
      const previewCacheLimit = 3;
      const mountedIndexes = new Set();
      let layoutVersion = 0;
      let gridLayoutCache = null;
      let focusedLayoutCache = null;
      let hoveredIndex = null;
      let hasRendered = false;

      const data = (function createBoxData() {
        const windowSizeY = document.documentElement.clientHeight;
        const dimensions = colsBoxMaxSizeXF(windowSizeX);
        const imgMaxSizeY = dimensions.boxMaxSizeX + 100;

        return photoGalleryData.map(function createBox(item, index) {
          const ar = item.w / item.h;
          const sizeX = Math.min(item.w, dimensions.boxMaxSizeX, imgMaxSizeY * ar);
          const sizeY = sizeX / ar + promptSizeY;

          return {
            id: item.id,
            prompt: item.prompt,
            thumbnailUrl: item.thumbnailUrl,
            previewUrl: item.previewUrl,
            naturalSizeX: item.w,
            ar,
            skeleton: item.skeleton,
            sizeX: spring(sizeX),
            sizeY: spring(sizeY),
            x: spring(Math.floor(index / dimensions.cols) * -windowSizeX - windowSizeX),
            y: spring(windowSizeY + Math.floor(index / dimensions.cols) * imgMaxSizeY),
            scale: spring(1),
            fxFactor: spring(20),
            node: null,
            img: null,
            promptNode: null,
            descriptionCardNode: null,
          };
        });
      })();
      const indexById = new Map(data.map(function mapItemId(item, index) {
        return [item.id, index];
      }));
      const activeSpringIndexes = new Set();
      const modeTransitionIndexes = new Set();
      let gridTransitionFocusIndex = null;

      function ensureBoxElements(item, index) {
        if (item.node != null) return;

        const node = document.createElement('div');
        const img = document.createElement('img');
        const promptNode = document.createElement('figcaption');
        const descriptionCardNode = document.createElement('div');

        node.className = item.skeleton ? 'box skeleton' : 'box';
        if (!item.skeleton && item.thumbnailUrl) {
          node.style.backgroundImage = 'url("' + item.thumbnailUrl.replace(/"/g, '%22') + '")';
        }
        if (item.skeleton) node.setAttribute('aria-hidden', 'true');
        img.alt = item.skeleton ? '' : item.prompt;
        img.decoding = 'async';
        img.draggable = false;
        img.fetchPriority = 'high';
        promptNode.className = 'prompt';
        promptNode.textContent = item.skeleton ? '' : item.prompt;
        descriptionCardNode.className = 'description-card';
        descriptionCardNode.textContent = item.skeleton ? '' : item.prompt;
        descriptionCardNode.setAttribute('aria-hidden', 'true');
        descriptionCardNode.addEventListener('click', function stopDescriptionClick(event) {
          event.stopPropagation();
        });
        node.append(img, promptNode, descriptionCardNode);

        item.node = node;
        item.img = img;
        item.promptNode = promptNode;
        item.descriptionCardNode = descriptionCardNode;
        mountedIndexes.add(index);
      }

      function clearPreview(item) {
        if (item.img == null) return;
        item.img.onload = null;
        item.img.onerror = null;
        item.img.removeAttribute('src');
        delete item.img.dataset.src;
        delete item.img.dataset.loadedSrc;
        item.img.style.display = 'none';
      }

      function forgetPreview(index) {
        const lruIndex = previewLru.indexOf(index);
        if (lruIndex !== -1) previewLru.splice(lruIndex, 1);
        clearPreview(data[index]);
      }

      function rememberPreview(index) {
        const lruIndex = previewLru.indexOf(index);
        if (lruIndex !== -1) previewLru.splice(lruIndex, 1);
        previewLru.push(index);
        while (previewLru.length > previewCacheLimit) {
          forgetPreview(previewLru[0]);
        }
      }

      function releaseBoxElements(item, index) {
        if (item.node == null) return;
        forgetPreview(index);
        item.node.remove();
        item.node.style.backgroundImage = 'none';
        item.node = null;
        item.img = null;
        item.promptNode = null;
        item.descriptionCardNode = null;
        mountedIndexes.delete(index);
      }

      function itemSpringForEach(item, callback) {
        callback(item.sizeX);
        callback(item.sizeY);
        callback(item.x);
        callback(item.y);
        callback(item.scale);
        callback(item.fxFactor);
      }

      function setItemDestinations(index, destinations, animate) {

        document.body.style.cursor = cursor;
        document.body.style.overflowY = newFocused == null ? 'auto' : 'hidden';
        dummyPlaceholder.style.height = rowsTop[rowsTop.length - 1] + 'px';

        if (adjustedScrollTop !== currentScrollY) {
          (isSafari ? document.body : window).scrollTo({ top: adjustedScrollTop });
        }
        if (newFocused !== focused) {
          const hash = newFocused == null ? '' : '#' + encodeURIComponent(data[newFocused].id);
          window.history.pushState(null, '', window.location.pathname + window.location.search + hash);
        }

        events.keydown = null;
        events.click = null;
        events.mousemove = null;
        animatedUntilTime = stillAnimating ? newAnimatedUntilTime : null;
        anchor = newAnchor;
        windowSizeX = newWindowSizeX;
        scrollY = adjustedScrollTop;
        hasRendered = true;
        return stillAnimating;
      }

      statusNode.hidden = true;
      scheduleRender();

      function applyMetadata(index, item) {
        if (item == null) return;
        const box = data[index];
        if (!box) return;

        const nextAr = item.w / item.h;
        if (Math.abs(box.ar - nextAr) > 0.001) layoutVersion += 1;
        box.prompt = item.prompt;
        box.naturalSizeX = Math.max(box.naturalSizeX, item.w);
        box.ar = nextAr;
        if (box.node != null) {
          box.img.alt = item.prompt;
          box.promptNode.textContent = item.prompt;
          box.descriptionCardNode.textContent = item.prompt;
        }
        scheduleRender();
      }

      function hydrateBox(index, fetchPriority, signal) {
        const box = data[index];
        if (!box || !box.skeleton) return Promise.resolve(true);

        return new Promise(function preloadThumbnail(resolve) {
          const thumbnail = new Image();
          let settled = false;
          thumbnail.decoding = 'async';
          thumbnail.fetchPriority = fetchPriority;

          function cleanup() {
            thumbnail.onload = null;
            thumbnail.onerror = null;
            signal.removeEventListener('abort', cancelHydration);
          }

          function finishHydration(completed, thumbnailLoaded) {
            if (settled) return;
            settled = true;
            cleanup();
            if (completed) {
              box.skeleton = false;
              if (box.node != null) {
                box.node.classList.remove('skeleton');
                box.node.removeAttribute('aria-hidden');
                box.node.style.backgroundImage = thumbnailLoaded
                  ? 'url("' + box.thumbnailUrl.replace(/"/g, '%22') + '")'
                  : 'none';
                box.img.alt = box.prompt;
                box.promptNode.textContent = box.prompt;
                box.descriptionCardNode.textContent = box.prompt;
              }
              scheduleRender();
            }
            resolve(completed);
          }

          function cancelHydration() {
            if (settled) return;
            settled = true;
            cleanup();
            thumbnail.removeAttribute('src');
            resolve(false);
          }

          if (signal.aborted) {
            finishHydration(false, false);
            return;
          }
          signal.addEventListener('abort', cancelHydration, { once: true });
          thumbnail.onload = function onThumbnailLoaded() {
            finishHydration(true, true);
          };
          thumbnail.onerror = function onThumbnailError() {
            if (signal.aborted) {
              finishHydration(false, false);
              return;
            }
            console.warn('Unable to load asset thumbnail', box.id);
            finishHydration(true, false);
          };
          thumbnail.src = box.thumbnailUrl;
        });
      }

      return { applyMetadata, hydrateBox };
    }

    function createGalleryHydrator(result, gallery) {
      const states = new Uint8Array(result.assets.length);
      const priorityIndexes = [];
      const priorityIndexSet = new Set();
      const activeTasks = new Map();
      const metadataStates = new Uint8Array(result.assets.length);
      const metadataIndexes = [];
      const concurrency = 8;
      const prefetchConcurrency = 2;
      const metadataConcurrency = 1;
      let activeCount = 0;
      let activePrefetchCount = 0;
      let activeMetadataCount = 0;
      let rangeStart = 0;
      let rangeEnd = -1;
      let visibleStart = 0;
      let visibleEnd = -1;

      function isVisibleIndex(index) {
        return index >= visibleStart && index <= visibleEnd;
      }

      function nextPriorityIndex() {
        while (priorityIndexes.length > 0) {
          const index = priorityIndexes.shift();
          priorityIndexSet.delete(index);
          if (states[index] === 0) return index;
        }
        return -1;
      }

      function nextVisibleIndex() {
        for (let index = visibleStart; index <= visibleEnd; index += 1) {
          if (states[index] === 0) return index;
        }
        return -1;
      }

      function nextPrefetchIndex() {
        for (let index = visibleStart - 1; index >= rangeStart; index -= 1) {
          if (states[index] === 0) return index;
        }
        for (let index = visibleEnd + 1; index <= rangeEnd; index += 1) {
          if (states[index] === 0) return index;
        }
        return -1;
      }

      function queueMetadata(index) {
        if (!result.showMetadata || metadataStates[index] !== 0) return;
        metadataStates[index] = 1;
        metadataIndexes.push(index);
        pumpMetadata();
      }

      function hasUnfinishedVisibleHydration() {
        for (let index = visibleStart; index <= visibleEnd; index += 1) {
          if (states[index] !== 2) return true;
        }
        return false;
      }

      function pumpMetadata() {
        if (hasUnfinishedVisibleHydration()) return;
        while (activeMetadataCount < metadataConcurrency && metadataIndexes.length > 0) {
          const index = metadataIndexes.shift();
          activeMetadataCount += 1;
          void loadGalleryMetadata(result.assets[index], index)
            .then(function applyLoadedMetadata(item) {
              gallery.applyMetadata(index, item);
            })
            .catch(function onMetadataError(error) {
              console.warn('Unable to apply asset metadata', result.assets[index].id, error);
            })
            .finally(function finishMetadata() {
              metadataStates[index] = 2;
              activeMetadataCount -= 1;
              pumpMetadata();
            });
        }
      }

      function startHydration(index, isPrefetch) {
        const controller = new AbortController();
        const task = {
          controller,
          isPrefetch,
          retryAsPriority: false,
        };
        let completed = true;
        states[index] = 1;
        activeTasks.set(index, task);
        activeCount += 1;
        if (isPrefetch) activePrefetchCount += 1;

        void gallery.hydrateBox(index, isPrefetch ? 'low' : 'high', controller.signal)
          .then(function recordHydrationResult(didComplete) {
            completed = didComplete;
          })
          .catch(function onAssetHydrationError(error) {
            console.warn('Unable to hydrate gallery item', result.assets[index].id, error);
          })
          .finally(function finishHydration() {
            activeTasks.delete(index);
            activeCount -= 1;
            if (isPrefetch) activePrefetchCount -= 1;
            states[index] = completed ? 2 : 0;
            if (completed) queueMetadata(index);
            else if (task.retryAsPriority) prioritizeIndex(index);
            pumpMetadata();
            pump();
          });
      }

      function pump() {
        while (activeCount < concurrency) {
          const priorityIndex = nextPriorityIndex();
          if (priorityIndex !== -1) {
            startHydration(priorityIndex, false);
            continue;
          }

          const visibleIndex = nextVisibleIndex();
          if (visibleIndex !== -1) {
            startHydration(visibleIndex, false);
            continue;
          }

          if (activePrefetchCount >= prefetchConcurrency) return;
          const prefetchIndex = nextPrefetchIndex();
          if (prefetchIndex === -1) return;
          startHydration(prefetchIndex, true);
        }
      }

      function prioritizeIndex(index) {
        if (index < 0 || index >= result.assets.length || states[index] === 2) return;
        if (states[index] === 1) {
          const task = activeTasks.get(index);
          if (task?.isPrefetch) {
            task.retryAsPriority = true;
            task.controller.abort();
          }
          return;
        }
        if (!priorityIndexSet.has(index)) {
          priorityIndexSet.add(index);
          priorityIndexes.push(index);
        }
      }

      function rebalanceActiveRequests() {
        let hasPendingVisible = nextVisibleIndex() !== -1;
        for (const [index, task] of activeTasks) {
          if (index < rangeStart || index > rangeEnd) {
            task.controller.abort();
            continue;
          }
          if (task.isPrefetch && isVisibleIndex(index)) {
            task.retryAsPriority = true;
            task.controller.abort();
            continue;
          }
          if (
            hasPendingVisible &&
            activeCount >= concurrency &&
            !isVisibleIndex(index) &&
            !task.retryAsPriority
          ) {
            task.controller.abort();
            hasPendingVisible = nextVisibleIndex() !== -1;
          }
        }
      }

      return {
        requestWindow(start, end, priorityStart, priorityEnd, focusedIndex) {
          rangeStart = Math.min(result.assets.length - 1, Math.max(0, start));
          rangeEnd = Math.min(result.assets.length - 1, Math.max(rangeStart, end));
          visibleStart = Math.min(rangeEnd, Math.max(rangeStart, priorityStart));
          visibleEnd = Math.min(rangeEnd, Math.max(visibleStart, priorityEnd));
          if (Number.isInteger(focusedIndex)) prioritizeIndex(focusedIndex);
          rebalanceActiveRequests();
          pump();
          pumpMetadata();
        },
        requestIndex(index) {
          prioritizeIndex(index);
          pump();
        },
      };
    }

    void loadPhotoGalleryData()
      .then(function onGalleryLoaded(result) {
        if (result.items.length === 0) {
          setStatus('This album is empty', 'No image assets were returned by Immich.');
          return;
        }

        let requestHydrationWindow = function ignoreEarlyHydrationRequest() {};
        const gallery = startGallery(result.items, function requestVisibleWindow(
          start,
          end,
          visibleStart,
          visibleEnd,
          focusedIndex,
        ) {
          requestHydrationWindow(start, end, visibleStart, visibleEnd, focusedIndex);
        });
        const hydrator = createGalleryHydrator(result, gallery);
        requestHydrationWindow = hydrator.requestWindow;

        let hashImageId = '';
        try {
          hashImageId = decodeURIComponent(window.location.hash.slice(1));
        } catch {}
        if (hashImageId) {
          hydrator.requestIndex(result.assets.findIndex(function findHashAsset(asset) {
            return asset.id === hashImageId;
          }));
        }
      })
      .catch(function onGalleryError(error) {
        console.error(error);
        setStatus('Unable to load this album', error instanceof Error ? error.message : String(error));
      });
  </script>
</body>
